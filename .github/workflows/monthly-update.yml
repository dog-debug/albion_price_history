name: Monthly AODP Market History Update

on:
  schedule:
    # Run at 12:00 UTC (noon) on the 1st of every month
    - cron: '0 12 1 * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  update-market-history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Create directories
        run: |
          mkdir -p albion_data_dumps/extracted/history
          mkdir -p albion_data_dumps/formatted
          mkdir -p albion_data_dumps/temp
      
      - name: Run AODP CI Processor
        run: python albion_data_extractor/ci_processor.py
      
      - name: Clean up temporary directories
        run: |
          rm -rf albion_data_dumps/raw/
          rm -rf albion_data_dumps/extracted/
          rm -rf albion_data_dumps/temp/
      
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add albion_data_dumps/formatted/
          git commit -m "chore: update market history data - $(date +'%Y-%m-%d')"
          git push
      
      - name: Create summary
        run: |
          echo "### AODP Market History Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Market history data updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new market history files found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
