name: Validate and Fix JSON Format

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'albion_data_dumps/**/formatted/*.json'

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Validate generated JSON files
        id: validate
        run: |
          echo "Validating all generated JSON files under albion_data_dumps..."
          python validate_json_random.py . --all --fix 2>&1 | tee validation_output.txt

          if grep -q "[SUMMARY] Valid:" validation_output.txt; then
            if grep -q "Invalid: 0" validation_output.txt; then
              echo "validation_passed=true" >> $GITHUB_OUTPUT
              echo "status=[OK] Validation passed"
            else
              echo "validation_passed=false" >> $GITHUB_OUTPUT
              echo "status=[ERROR] Validation failed"
            fi
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            echo "status=[ERROR] Validation failed"
          fi
        continue-on-error: true
      
      - name: Generate validation report
        if: always()
        run: |
          echo "## JSON Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.validate.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat validation_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Check for files with issues (optional)
        if: steps.validate.outputs.validation_passed == 'false'
        run: |
          echo "Validation found issues. Consider reviewing the report above."
          echo "To fix JSON files automatically, use: python fix_json_format.py <owner/repo> --filename <file>"
        continue-on-error: true
      
      - name: Notify on failure
        if: failure() && steps.validate.outputs.validation_passed == 'false'
        run: |
          echo "⚠️ JSON validation workflow completed with warnings"
          echo "Some JSON files may have formatting issues"
