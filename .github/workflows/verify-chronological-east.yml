name: Verify Chronological Order - East

on:
  workflow_dispatch:

jobs:
  verify-chronological-east:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: albion_data_dumps/east/formatted
          sparse-checkout-cone-mode: false
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Verify Chronological Order - East
        run: |
          import json
          from pathlib import Path
          from datetime import datetime
          
          east_dir = Path('albion_data_dumps/east/formatted')
          json_files = sorted(east_dir.glob('*.json'))
          
          print("=" * 80)
          print("CHRONOLOGICAL ORDER VERIFICATION - EAST SERVER")
          print("=" * 80)
          
          if not json_files:
              print("⚠️  No JSON files found in east/formatted directory")
              exit(0)
          
          out_of_order_files = []
          files_checked = 0
          records_checked = 0
          
          for f in json_files:
              try:
                  with open(f, 'r', encoding='utf-8') as json_file:
                      data = json.load(json_file)
                  
                  if not isinstance(data, list) or len(data) == 0:
                      continue
                  
                  files_checked += 1
                  
                  # Extract timestamps
                  timestamps = []
                  for record in data:
                      if isinstance(record, dict) and 'timestamp' in record:
                          try:
                              # Parse ISO format timestamp
                              ts_str = record['timestamp'].replace('Z', '+00:00')
                              ts = datetime.fromisoformat(ts_str)
                              timestamps.append((ts, record.get('timestamp')))
                              records_checked += 1
                          except:
                              pass
                  
                  if len(timestamps) < 2:
                      continue
                  
                  # Check if in chronological order (oldest to newest)
                  is_ordered = all(timestamps[i][0] <= timestamps[i+1][0] for i in range(len(timestamps)-1))
                  
                  if not is_ordered:
                      # Find first out-of-order pair
                      first_violation = None
                      for i in range(len(timestamps)-1):
                          if timestamps[i][0] > timestamps[i+1][0]:
                              first_violation = (i, timestamps[i][1], timestamps[i+1][1])
                              break
                      
                      out_of_order_files.append({
                          'file': f.name,
                          'total_records': len(data),
                          'first_violation_at_index': first_violation[0] if first_violation else None,
                          'violation_detail': f"{first_violation[1]} > {first_violation[2]}" if first_violation else "Unknown"
                      })
              
              except Exception as e:
                  print(f"⚠️  Error processing {f.name}: {e}")
          
          # Report
          print(f"\n📊 SCAN RESULTS:")
          print(f"  Files checked: {files_checked}")
          print(f"  Records checked: {records_checked}")
          print(f"  Average records per file: {records_checked // files_checked if files_checked > 0 else 0}")
          
          print(f"\n⏰ CHRONOLOGICAL ORDER:")
          
          if out_of_order_files:
              print(f"  ❌ Files with out-of-order timestamps: {len(out_of_order_files)}")
              print(f"\n  Details:")
              for file_info in out_of_order_files[:20]:
                  print(f"    {file_info['file']}")
                  print(f"      Records: {file_info['total_records']}")
                  print(f"      First violation at index: {file_info['first_violation_at_index']}")
                  print(f"      Violation: {file_info['violation_detail']}")
          else:
              print(f"  ✅ All records are in chronological order (oldest to newest)")
          
          print(f"\n{'=' * 80}")
          if out_of_order_files:
              print(f"⚠️  RECOMMENDATION: {len(out_of_order_files)} file(s) need manual review")
              print(f"    This may indicate data was inserted out of order or timestamps are incorrect")
          else:
              print(f"✅ All data integrity checks passed for chronological ordering")
          print(f"{'=' * 80}")
        shell: python
      
      - name: Generate Summary
        run: echo "### East Chronological Verification Complete ✅" >> $GITHUB_STEP_SUMMARY
