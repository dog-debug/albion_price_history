name: Wipe Price History Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe-data:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Remove price history data
        run: |
          echo "[WIPE] Removing price history data..."
          
          # Remove albion_data_dumps directory
          if [ -d "albion_data_dumps" ]; then
            echo "[REMOVE] Directory: albion_data_dumps/"
            rm -rf albion_data_dumps
          else
            echo "[SKIP] Directory not found: albion_data_dumps/"
          fi
          
          # Remove .processed_*.txt files
          for file in .processed_europe.txt .processed_east.txt .processed_west.txt; do
            if [ -f "albion_data_extractor/$file" ]; then
              echo "[REMOVE] File: $file"
              rm "albion_data_extractor/$file"
            else
              echo "[SKIP] File not found: $file"
            fi
          done
          
          echo "[SUCCESS] Price history data wiped successfully!"
      
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "[INFO] No changes to commit (data already clean)"
          else
            git commit -m "chore: wipe price history data for fresh start"
            git push origin main --force-with-lease
            echo "[SUCCESS] Changes committed and pushed to main"
          fi

