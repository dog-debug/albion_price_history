name: Weekly AODP Market History Update

on:
  schedule:
    # Run every hour (UTC)
    - cron: '0 * * * *'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      reset_processed:
        description: 'Reset the .processed state and re-download archived market history files'
        required: false
        default: false
        type: boolean

jobs:
  update-market-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Record workflow start time
        run: |
          echo "ALBION_JOB_STARTED_AT=${{ github.run_started_at }}" >> "$GITHUB_ENV"
          echo "GITHUB_RUN_STARTED_AT=${{ github.run_started_at }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create directories
        run: |
          mkdir -p albion_data_dumps/europe/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/east/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/west/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/temp

      - name: Run AODP CI Processor
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_MAX_RUNTIME_SECONDS: '19800'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '1'
          ALBION_MAX_FILES_PER_RUN: '1'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Clean up temporary directories
        run: |
          rm -rf albion_data_dumps/*/raw/
          rm -rf albion_data_dumps/*/extracted/
          rm -rf albion_data_dumps/temp/

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload formatted market history as artifact
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: albion-market-history-${{ github.run_number }}
          path: albion_data_dumps/**/formatted/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Create summary
        run: |
          echo "### AODP Market History Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Market history data updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new market history files found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
