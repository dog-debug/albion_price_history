name: Weekly AODP Market History Update

on:
  schedule:
    # Run every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      server:
        description: 'Which server to process this run. Use all to process all servers.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - europe
          - east
          - west
      reset_processed:
        description: 'Reset the .processed state and re-download archived market history files'
        required: false
        default: false
        type: boolean

concurrency:
  group: market-history-update
  cancel-in-progress: false

jobs:
  update-market-history:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: [europe, east, west]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
      - name: Skip unmatched manual server
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.server != 'all' && inputs.server != matrix.server }}
        run: |
          echo "Skipping ${{ matrix.server }} because manual selection is ${{ inputs.server }}"
          exit 0

      - name: Record workflow start time
        run: |
          echo "ALBION_JOB_STARTED_AT=${{ github.run_started_at }}" >> "$GITHUB_ENV"
          echo "GITHUB_RUN_STARTED_AT=${{ github.run_started_at }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create directories
        run: |
          mkdir -p "albion_data_dumps/${{ matrix.server }}/{raw,extracted,formatted}"
          mkdir -p albion_data_dumps/temp

      - name: Run AODP CI Processor
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_TARGET_SERVER: ${{ matrix.server }}
          ALBION_MAX_RUNTIME_SECONDS: '19800'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '0'
          ALBION_MAX_FILES_PER_RUN: '0'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Package generated output
        run: |
          set -e
          if [ -d "albion_data_dumps/${{ matrix.server }}/formatted" ] && find "albion_data_dumps/${{ matrix.server }}/formatted" -type f | grep -q .; then
            zip -r "albion-market-history-${{ matrix.server }}-${{ github.run_number }}.zip" "albion_data_dumps/${{ matrix.server }}"
            echo "HAS_DATA=true" >> "$GITHUB_ENV"
          else
            echo "HAS_DATA=false" >> "$GITHUB_ENV"
          fi

      - name: Upload generated artifact
        if: ${{ env.HAS_DATA == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: albion-market-history-${{ matrix.server }}-${{ github.run_number }}
          path: albion-market-history-${{ matrix.server }}-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Clean up temporary directories
        if: ${{ always() }}
        run: |
          rm -rf albion_data_dumps/*/raw/
          rm -rf albion_data_dumps/*/extracted/
          rm -rf albion_data_dumps/temp/

      - name: Create summary
        run: |
          echo "### AODP Market History Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Server:** ${{ matrix.server }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "**Timestamp:** $(date)" >> "$GITHUB_STEP_SUMMARY"
