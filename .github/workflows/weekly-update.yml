name: Weekly AODP Market History Update

on:
  schedule:
    # Run every hour (UTC)
    - cron: '0 * * * *'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      server:
        description: 'Which server to process this run. Use all to process the full queue in order.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - europe
          - east
          - west
      reset_processed:
        description: 'Reset the .processed state and re-download archived market history files'
        required: false
        default: false
        type: boolean

concurrency:
  group: market-history-update
  cancel-in-progress: false

jobs:
  update-market-history:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: [europe, east, west]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name != 'workflow_dispatch' || inputs.server == 'all' || inputs.server == matrix.server

    permissions:
      contents: write

    steps:
      - name: Record workflow start time
        run: |
          echo "ALBION_JOB_STARTED_AT=${{ github.run_started_at }}" >> "$GITHUB_ENV"
          echo "GITHUB_RUN_STARTED_AT=${{ github.run_started_at }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create directories
        run: |
          mkdir -p albion_data_dumps/europe/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/east/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/west/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/temp

      - name: Run AODP CI Processor
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_TARGET_SERVER: ${{ matrix.server }}
          ALBION_MAX_RUNTIME_SECONDS: '19800'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '0'
          ALBION_MAX_FILES_PER_RUN: '0'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Clean up temporary directories
        run: |
          rm -rf albion_data_dumps/*/raw/
          rm -rf albion_data_dumps/*/extracted/
          rm -rf albion_data_dumps/temp/

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add albion_data_dumps/*/formatted/
          git commit -m "chore: update market history data - $(date +'%Y-%m-%d')"
          git push

      - name: Create summary
        run: |
          echo "### AODP Market History Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Market history data updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new market history files found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
