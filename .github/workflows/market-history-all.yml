name: Market History Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reset_processed:
        description: 'Reset the per-server processed state and re-download archived files'
        required: false
        default: false
        type: boolean

concurrency:
  group: albion-market-history-all
  cancel-in-progress: false

jobs:
  market-history-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Prepare server data folders
        run: |
          mkdir -p data/europe/{raw,extracted,formatted}
          mkdir -p data/east/{raw,extracted,formatted}
          mkdir -p data/west/{raw,extracted,formatted}
          mkdir -p data/temp

      - name: Process Europe server
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_TARGET_SERVER: europe
          ALBION_DATA_ROOT: data
          ALBION_MAX_RUNTIME_SECONDS: '18000'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '1'
          ALBION_MAX_FILES_PER_RUN: '10'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Process East server
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_TARGET_SERVER: east
          ALBION_DATA_ROOT: data
          ALBION_MAX_RUNTIME_SECONDS: '18000'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '1'
          ALBION_MAX_FILES_PER_RUN: '10'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Process West server
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_TARGET_SERVER: west
          ALBION_DATA_ROOT: data
          ALBION_MAX_RUNTIME_SECONDS: '18000'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '1'
          ALBION_MAX_FILES_PER_RUN: '10'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Commit and push server output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git restore --staged data/*/raw data/*/extracted 2>/dev/null || true
          git rm -r --cached --ignore-unmatch data/europe/raw data/europe/extracted data/east/raw data/east/extracted data/west/raw data/west/extracted 2>/dev/null || true
          rm -rf data/europe/raw data/europe/extracted data/east/raw data/east/extracted data/west/raw data/west/extracted
          git add data/europe/formatted data/east/formatted data/west/formatted
          if git diff --cached --quiet; then
            echo "No market history changes to push"
          else
            git commit -m "chore: update all market history data"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Summary
        run: |
          echo "### Market History Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** all servers" >> "$GITHUB_STEP_SUMMARY"
          echo "**Files per server:** 10" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** scheduled and manual" >> "$GITHUB_STEP_SUMMARY"
          echo "**Timestamp:** $(date)" >> "$GITHUB_STEP_SUMMARY"
