name: East Market History Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reset_processed:
        description: 'Reset the east .processed state and re-download archived east market_history files'
        required: false
        default: false
        type: boolean

jobs:
  east-market-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create east directories
        run: |
          mkdir -p albion_data_dumps/east/{raw,extracted,formatted}
          mkdir -p albion_data_dumps/temp

      - name: Run east server processor
        env:
          ALBION_RESET_PROCESSED: ${{ inputs.reset_processed && '1' || '0' }}
          ALBION_JOB_STARTED_AT: ${{ github.run_started_at }}
          ALBION_TARGET_SERVER: east
          ALBION_MAX_RUNTIME_SECONDS: '19800'
          ALBION_RUNTIME_BUFFER_SECONDS: '600'
          ALBION_MAX_WORKERS: '1'
          ALBION_MAX_FILES_PER_RUN: '1'
          ALBION_DOWNLOAD_RETRIES: '5'
          ALBION_DOWNLOAD_TIMEOUT_SECONDS: '120'
        run: python albion_data_extractor/ci_processor.py

      - name: Commit and push east output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A albion_data_dumps/east/formatted
          if git diff --cached --quiet; then
            echo "No east data changes to push"
          else
            git commit -m "chore: update east market history data"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Summary
        run: |
          echo "### East Market History Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Server:** east" >> "$GITHUB_STEP_SUMMARY"
          echo "**Files per run:** 1" >> "$GITHUB_STEP_SUMMARY"
          echo "**Timestamp:** $(date)" >> "$GITHUB_STEP_SUMMARY"
